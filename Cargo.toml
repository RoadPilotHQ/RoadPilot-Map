[workspace]
resolver = "3"
members = [
    "crates/roadpilot-map",
    "crates/roadpilot-map-archive",
    "crates/roadpilot-map-cli",
    "crates/roadpilot-map-formats",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/RoadPilotHQ/RoadPilot-Map"
# No license has been chosen yet (see docs/open-questions.md, L4).
# Publishing stays disabled until it is.
publish = false

[workspace.dependencies]
roadpilot-map = { path = "crates/roadpilot-map", version = "0.1.0" }
roadpilot-map-archive = { path = "crates/roadpilot-map-archive", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The default Clippy lints stay enabled. These additions enforce the
# conventions in docs/architecture/crates.md. Required checks run Clippy
# with `-D warnings`, so every warning fails the check.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
